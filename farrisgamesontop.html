    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a4d 50%, #0d0d2b 100%);
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            background: rgba(10, 14, 39, 0.9);
            border-bottom: 3px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        h1 {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ff00, #ffff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: #00ffff;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            margin-top: 10px;
        }

        /* Filter Section */
        .filter-section {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px;
            background: rgba(26, 26, 77, 0.8);
            border-bottom: 2px solid #ff00ff;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .filter-btn {
            padding: 12px 25px;
            border: 2px solid #00ffff;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            cursor: pointer;
            border-radius: 20px;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* Games Container */
        .container {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 60px rgba(255, 0, 255, 0.5);
            border-color: #ff00ff;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.3));
        }

        .game-icon {
            font-size: 3em;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .game-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        .game-category {
            color: #ff00ff;
            font-size: 0.85em;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }

        .play-btn {
            background: linear-gradient(45deg, #00ffff, #00ff88);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .play-btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #0a0e27, #1a1a4d);
            margin: 10% auto;
            padding: 40px;
            border: 2px solid #00ffff;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .modal h2 {
            color: #00ffff;
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        .modal p {
            color: #00ff88;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .modal-buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .play-game-btn, .close-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

            background: linear-gradient(45deg, #00ffff, #00ff88);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .play-game-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        .close-btn {
            background: rgba(255, 0, 127, 0.2);
            color: #ff007f;
            border: 2px solid #ff007f;
        }

        .close-btn:hover {
            background: rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        .close {
            color: #00ffff;
            float: right;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            background: rgba(10, 14, 39, 0.9);
            border-top: 2px solid #ff00ff;

        @media (max-width: 768px) {

            }

            .game-icon {

            }

            .modal-content {

                width: 95%;
            }

            { id: 818, name: 'Archery Pro', icon: '🏹', category: 'sports', description: 'Archery mastery!' },
            { id: 819, name: 'Dart Champion', icon: '🎯', category: 'sports', description: 'Dart throws!' },
            { id: 820, name: 'Badminton Rally', icon: '🏸', category: 'sports', description: 'Badminton action!' },
            ...Array.from({length: 180}, (_, i) => ({
                id: 821 + i,
                name: `Sports Game ${821 + i}`,
                icon: ['🏈', '🏀', '⚽', '🎾', '⚾', '⛳', '🏒', '🏐', '🥊', '🥋'][i % 10],
                category: 'sports',
                description: `Sports challenge #${821 + i}!`
            }))
        ];

        let currentGame = null;
        let filteredGames = games;

        // Initialize stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Render games
        function renderGames(gamesToRender) {
            const gamesGrid = document.getElementById('gamesGrid');
            gamesGrid.innerHTML = '';
            
            gamesToRender.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-title">${game.name}</div>
                    <div class="game-category">${game.category.toUpperCase()}</div>
                    <button class="play-btn" onclick="openModal(${game.id})">▶ PLAY</button>
                `;
                gamesGrid.appendChild(gameCard);
            });

            document.getElementById('totalGames').textContent = gamesToRender.length + '+';
        }

        // Filter games
        function filterGames(category) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter games
            if (category === 'all') {
                filteredGames = games;
            } else {
                filteredGames = games.filter(game => game.category === category);
            }
            renderGames(filteredGames);
        }

        // Open modal
        function openModal(gameId) {
            const game = games.find(g => g.id === gameId);
            if (game) {
                currentGame = game;
                document.getElementById('modalIcon').textContent = game.icon;
                document.getElementById('modalTitle').textContent = game.name;
                document.getElementById('modalCategory').textContent = `Category: ${game.category.toUpperCase()}`;
                document.getElementById('modalDescription').textContent = game.description;
                document.getElementById('gameModal').style.display = 'block';
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        // Start game
        function startGame() {
            if (currentGame) {
                alert(`🎮 Starting ${currentGame.name}! 🎮\n\nGet ready for an amazing adventure!\n\n${currentGame.description}`);
                closeModal();
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize on page load
        window.addEventListener('load', function() {
            createStars();
            renderGames(games);
        });
    </script>
</body>
</html>
