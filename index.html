<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farris Games On Top - 1000 Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Star Background -->
    <div class="stars"></div>

    <!-- Header -->
    <header>
        <h1>🚀 Farris Games On Top</h1>
        <p class="subtitle">1000 Games | Infinite Fun | Space Adventure</p>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Search games..." 
                    autocomplete="off"
                >
                <button id="searchBtn">🔎 Search</button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">🎮 All Games</button>
                <button class="filter-btn" data-filter="action">⚔️ Action</button>
                <button class="filter-btn" data-filter="puzzle">🧩 Puzzle</button>
                <button class="filter-btn" data-filter="adventure">🗺️ Adventure</button>
                <button class="filter-btn" data-filter="sports">⚽ Sports</button>
                <button class="filter-btn" data-filter="strategy">🎯 Strategy</button>
            </div>
        </div>

        <!-- Games Grid -->
        <div id="gamesGrid" class="gamesGrid"></div>

        <!-- Pagination -->
        <div class="pagination">
            <button id="prevBtn">← Previous</button>
            <span id="pageInfo"></span>
            <button id="nextBtn">Next →</button>
        </div>
    </div>

    <!-- Modal for Game Details -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalTitle"></div>
            <p id="modalDescription"></p>
            <p id="modalCategory"></p>
            <button id="playBtn">🎮 Play Game</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
